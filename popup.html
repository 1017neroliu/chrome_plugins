<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>译页</title>
  <link rel="stylesheet" href="ui.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup-page">
  <main>
    <header class="popup-header">
      <div class="brand">
        <img src="icons/icon48.png" width="36" height="36" alt="">
        <span>译页</span>
      </div>
      <a id="open-settings" class="secondary settings-link" href="options.html" target="_blank" rel="noopener">设置</a>
    </header>
    <h1>网页翻译</h1>
    <p class="intro">英文 → 简体中文</p>
    <label class="display-option"><input id="show-original" type="checkbox" disabled> 同时显示英文原文</label>
    <label class="display-option"><input id="whole-page" type="checkbox" disabled> 翻译全部区域（含导航和页脚）</label>
    <div class="buttons">
      <button id="translate" class="primary" type="button" disabled>翻译当前页</button>
      <button id="restore" class="secondary" type="button" disabled>恢复原文</button>
    </div>
    <progress id="progress" hidden></progress>
    <p id="status" class="feedback" role="status" aria-live="polite"></p>
    <button id="shortcuts" class="shortcut-link" type="button">设置翻译快捷键</button>
  </main>
</body>
</html>
